<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Москва // Праздничный Сигнал</title>
    <!-- Библиотека для праздничного столичного салюта -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 40px 20px;
            /* Плавные переливы московского неба */
            transition: background 3s ease; 
            position: relative;
            overflow-x: hidden;
            background-color: #0b0f19;
        }

        /* Элегантное размытие фона для глубины */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle at center, transparent 20%, rgba(0, 0, 0, 0.4) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Заголовок в стиле современных московских вывесок */
        h1 {
            font-size: 2.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.3), 0 4px 20px rgba(212, 175, 55, 0.2);
            z-index: 2;
        }

        /* Окно-карточка (раскрывается НАД кнопкой) */
        .modal {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            /* Стиль современной цифровой афиши с размытием */
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            max-width: 550px;
            width: 100%;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 0;
            z-index: 2;
        }

        /* Плавное открытие карточки */
        .modal.active {
            max-height: 800px;
            opacity: 1;
            padding: 40px 30px;
            margin-bottom: 30px;
        }

        .modal h2 {
            font-size: 1.6rem;
            color: #ffd700; /* Золотой акцент */
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .modal p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #f3f4f6;
            white-space: pre-line;
            text-align: left;
        }

        /* Стильная кнопка запуска иллюминации */
        .main-btn {
            font-family: inherit;
            background: linear-gradient(135deg, #e60026 0%, #b3001a 100%); /* Красный рубиновый оттенок */
            color: #ffffff;
            border: none;
            padding: 18px 45px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(230, 0, 38, 0.3);
            transition: all 0.3s ease;
            z-index: 2;
            margin-top: 20px;
        }

        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(230, 0, 38, 0.5), 0 0 15px rgba(255, 215, 0, 0.3);
            background: linear-gradient(135deg, #ff1a40 0%, #cc001f 100%);
        }

        .main-btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 15px rgba(230, 0, 38, 0.4);
        }
    </style>
</head>
<body>

    <!-- Главный заголовок страницы -->
    <h1>Поздровление 🏙️</h1>

    <!-- ОКНО С ПОЗДРАВЛЕНИЕМ -->
    <div class="modal" id="congratulationsModal">
        <h2>Дорогая Даша! ✨</h2>
        <p> Желаю тебе счастья, здоровья, любви, денег и всего самого наилучшего. С днем рождения!</p>
    </div>

    <!-- Кнопка, опускающаяся вниз -->
    <button class="main-btn" id="controlBtn" onclick="toggleMainModal()">Просмотреть</button>

    <script>
        const controlBtn = document.getElementById('controlBtn');
        const congratsModal = document.getElementById('congratulationsModal');
        let isModalOpen = false;

        // 1. СУТОЧНОЕ СВЕЧЕНИЕ СТОЛИЦЫ
        function updateBackground() {
            const hour = new Date().getHours(); 
            let backgroundStyle = "";

            if (hour >= 5 && hour < 11) {
                // Утро: Нежные рассветные акварельные тона над рекой
                backgroundStyle = "linear-gradient(135deg, #1f2d5a 0%, #e6a19f 100%)";
            } else if (hour >= 11 && hour < 17) {
                // День: Современный, деловой серо-голубой стиль Москва-Сити
                backgroundStyle = "linear-gradient(135deg, #2b3a4a 0%, #4a6984 100%)";
            } else if (hour >= 17 && hour < 22) {
                // Вечер: Глубокие сумерки с золотистыми отсветами вечерних огней
                backgroundStyle = "linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%)";
            } else {
                // Ночь: Праздничный бархатный темно-синий
                backgroundStyle = "linear-gradient(135deg, #05070c 0%, #0f131c 100%)";
            }
            document.body.style.background = backgroundStyle;
        }
        updateBackground();

        // 2. ЗАПУСК САЛЮТА И ОТКРЫТИЕ КАРТОЧКИ
        function toggleMainModal() {
            if (!isModalOpen) {
                congratsModal.classList.add('active');
                controlBtn.innerText = "Закрыть";
                isModalOpen = true;

                // Роскошный салют (золотые, красные и серебряные искры)
                if (window.confetti) {
                    confetti({ 
                        particleCount: 150, 
                        spread: 80, 
                        origin: { y: 0.65 },
                        colors: ['#ffd700', '#ff0033', '#ffffff', '#ff6600']
                    });
                }
            } else {
                congratsModal.classList.remove('active');
                controlBtn.innerText = "Просмотреть";
                isModalOpen = false;
            }
        }
    </script>
</body>
</html>
