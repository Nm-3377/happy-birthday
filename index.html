<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МЕТРО 2033 // ПОСТ_ОБЪЕКТ</title>
    <!-- Подключаем библиотеку эффектов для создания искр проводки -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Шрифты, создающие ощущение старой печатной машинки или военных документов */
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #d4c5a1; /* Цвет старого армейского брезента или запыленного металла */
            padding: 40px 20px;
            transition: background 3s ease; 
            position: relative;
            overflow-x: hidden;
            background-color: #0d0d0d;
        }

        /* Эффект темноты туннелей и мерцания старой лампы */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.8) 100%),
                        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            z-index: 1;
            background-size: 100% 100%, 100% 6px;
            pointer-events: none;
        }

        /* Заголовок: Военный трафарет на стали */
        h1 {
            font-size: 2.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 30px;
            color: #7a1f1d; /* Ржаво-красный цвет */
            text-shadow: 1px 1px 0px #000, 0 0 10px rgba(122, 31, 29, 0.4);
            z-index: 2;
            border: 2px dashed #423b2c;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
        }

        /* Окно-дневник (раскрывается над кнопкой) */
        .modal {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            /* Стилизация под старую пожелтевшую страницу из тетради Артема */
            background: #171511; 
            border: 2px solid #423b2c;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(122, 31, 29, 0.1);
            max-width: 550px;
            width: 100%;
            transition: all 0.5s ease-in-out;
            margin-bottom: 0;
            z-index: 2;
        }

        /* Активное состояние страницы дневника */
        .modal.active {
            max-height: 800px;
            opacity: 1;
            padding: 35px 30px;
            margin-bottom: 30px;
        }

        .modal h2 {
            font-size: 1.3rem;
            color: #a3906b;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 2px;
            border-bottom: 1px solid #423b2c;
            padding-bottom: 10px;
        }

        .modal p {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #c4b591;
            white-space: pre-line;
            text-align: left;
        }

        /* Суровая кнопка-рычаг гермозатвора */
        .main-btn {
            font-family: inherit;
            text-transform: uppercase;
            background: #3e4235; /* Защитный зеленый / хаки */
            color: #d4c5a1;
            border: 2px solid #5a614e;
            padding: 16px 45px;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6), inset 0 1px 3px rgba(255,255,255,0.1);
            transition: all 0.2s ease;
            z-index: 2;
            margin-top: 20px;
        }

        .main-btn:hover {
            background: #7a1f1d; /* Загорается красным при наведении */
            color: #ffffff;
            border-color: #a82c2a;
            box-shadow: 0 0 15px rgba(122, 31, 29, 0.6);
        }

        .main-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <!-- Главный шифр-заголовок -->
    <h1>СТАНЦИЯ_ВДНХ</h1>

    <!-- ОКНО С ПОЗДРАВЛЕНИЕМ (Появится над кнопкой) -->
    <div class="modal" id="congratulationsModal">
        <h2>[ ...Сквозь помехи радиостанций слышно чейто голос. ]</h2>
        
        
        Грант поздровляю тебя с днем рождения желаю тебе денег, счасть, здоровья, стальных нервов и всего наилучшего // КОНЕЦ СВЯЗИ</p>
    </div>

    <!-- Тяжелая кнопка в самом низу страницы -->
    <button class="main-btn" id="controlBtn" onclick="toggleMainModal()">Прослушать сигнал</button>

    <script>
        const controlBtn = document.getElementById('controlBtn');
        const congratsModal = document.getElementById('congratulationsModal');
        let isModalOpen = false;

        // 1. АТМОСФЕРНОЕ ОСВЕЩЕНИЕ СТАНЦИИ (ПО ВРЕМЕНИ СУТОК)
        function updateBackground() {
            const hour = new Date().getHours(); 
            let backgroundStyle = "";

            if (hour >= 5 && hour < 11) {
                // Утро: Тусклый желтоватый свет дизелей
                backgroundStyle = "radial-gradient(circle at center, #24211a 0%, #0a0a08 100%)";
            } else if (hour >= 11 && hour < 17) {
                // День: Относительно стабильный серо-зеленый свет фильтров
                backgroundStyle = "radial-gradient(circle at center, #191f1a 0%, #070807 100%)";
            } else if (hour >= 17 && hour < 22) {
                // Вечер: Глубокий ржаво-коричневый закат подземки
                backgroundStyle = "radial-gradient(circle at center, #211612 0%, #080504 100%)";
            } else {
                // Ночь: Тревожный красный свет аварийных ламп
                backgroundStyle = "radial-gradient(circle at center, #2b0b0b 0%, #080202 100%)";
            }
            document.body.style.background = backgroundStyle;
        }
        updateBackground();

        // 2. ЛОГИКА СРАБАТЫВАНИЯ РЫЧАГА
        function toggleMainModal() {
            if (!isModalOpen) {
                // Плавно раскрываем дневник над кнопкой
                congratsModal.classList.add('active');
                controlBtn.innerText = "ЗАКРЫТЬ ГЕРМОЗАТВОР";
                isModalOpen = true;

                // Вместо салюта — «искры из проводки» (огненные, желтые и белые вспышки)
                if (window.confetti) {
                    confetti({ 
                        particleCount: 100, 
                        spread: 60, 
                        origin: { y: 0.7 },
                        colors: ['#ff5500', '#ffaa00', '#ffffff', '#555555']
                    });
                }
            } else {
                // Сворачиваем дневник обратно, кнопка поднимается
                congratsModal.classList.remove('active');
                controlBtn.innerText = "ОТКРЫТЬ ГЕРМОЗАТВОР";
                isModalOpen = false;
            }
        }
    </script>
</body>
</html>
